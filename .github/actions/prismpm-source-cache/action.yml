name: Exact PrismPM source devcontainer cache
description: Upstream pinned buildx/cache setup, scoped to the restored source definition
outputs:
  cache-from:
    description: Build cache input
    value: ${{ steps.scope.outputs.cache-from }}
  cache-to:
    description: Build cache output
    value: ${{ steps.scope.outputs.cache-to }}
runs:
  using: composite
  steps:
    - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      with:
        version: v0.28.0
        driver-opts: image=docker.io/moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
    - id: scope
      shell: bash
      env:
        DEFINITION_HASH: ${{ hashFiles('prismpm/.devcontainer/**') }}
      run: |
        set -euo pipefail
        test -n "$DEFINITION_HASH"
        scope="prismpm-devcontainer-$DEFINITION_HASH"
        printf 'cache-from=type=gha,scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
        printf 'cache-to=type=gha,scope=%s,mode=max\n' "$scope" >> "$GITHUB_OUTPUT"
