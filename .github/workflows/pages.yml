name: Verify and publish cs1.618
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:peer-browser
      - run: npm run test:creative-browser
      - run: npm run test:identity-browser
      - run: npm run test:experience-browser
      - run: npm run test:discovery-browser
      - run: npm run test:objective-browser
      - run: npm run test:presentation-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to deploy a superseded main commit
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Newer main exists; leaving deployment to its verified workflow."
          fi
      - name: Deploy game
        if: steps.tip.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

  continue-evolution:
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Continue after verified build and deployment jobs
        env:
          GH_TOKEN: ${{ github.token }}
          CS_EVOLUTION: ${{ vars.CS_EVOLUTION }}
          CS_CONTINUE_FROM_PAGES: '1'
          NODE_USE_ENV_PROXY: '1'
        run: npx tsx scripts/evolution/continue.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolution-continuation-${{ github.run_id }}
          path: artifacts/evolution-chain/
          retention-days: 90
