name: PrismPM backport shared golden preparation
on:
  push:
    branches: [numeric-kernels]
    paths:
      - '.github/workflows/prismpm-backport-golden-preparation.yml'
      - 'scripts/numeric/golden-preparation.py'
      - 'scripts/numeric/tests/test_golden_preparation.py'
      - 'scripts/numeric/prismpm-preparation-candidate/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Development proposal only. No SDK build, native baseline import or admission.
jobs:
  shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: game
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: UOR-Foundation/prismpm
          ref: 3666dc0f9da56fcf066d96ec01cd9e14ec9a2974
          fetch-depth: 0
          path: prismpm
          persist-credentials: false
      - name: Restore the separately captured preparation source
        run: |
          set -euo pipefail
          umask 022
          python3 -m unittest discover -s game/scripts/numeric/tests -p test_golden_preparation.py
          python3 game/scripts/numeric/golden-preparation.py prepare
          printf '%s\n' "$GITHUB_SHA" > evidence/game-commit.txt
          printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" > evidence/runner-image.txt
          df -h > evidence/disk-before.txt
          test "$(df --output=avail -B1 . | tail -1)" -ge 8589934592
          mkdir -p prismpm/target
          cp game/scripts/numeric/golden-preparation.py prismpm/target/golden-preparation.py
          sudo chown -R 1000:1000 prismpm
      - id: cache
        uses: ./game/.github/actions/prismpm-source-cache
      - name: Run the original shared writer and checker
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6
        with:
          subFolder: prismpm
          skipContainerUserIdUpdate: true
          inheritEnv: false
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          cacheTo: ${{ steps.cache.outputs.cache-to }}
          push: never
          runCmd: |
            /usr/local/bin/prismpm-devcontainer-exec bash -euo pipefail <<'GOLDEN_PREPARATION'
            umask 022
            test "$(id -u)" = 1000
            for name in $(compgen -e); do
              case "$name" in
                CARGO_BUILD_*|CARGO_PROFILE_*|RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|RUSTC_WRAPPER|RUSTC_WORKSPACE_WRAPPER|NODE_OPTIONS|BASH_ENV|ENV|SHELLOPTS|BASHOPTS)
                  printf 'Unowned exported compiler/shell environment: %s\n' "$name" >&2
                  exit 1 ;;
              esac
            done
            test "$(df --output=avail -B1 . | tail -1)" -ge 8589934592
            bash scripts/bootstrap-verify.sh --check-source
            python3 target/golden-preparation.py run --source .
            GOLDEN_PREPARATION
      - name: Retain actual source container identity
        if: always()
        run: python3 game/scripts/numeric/golden-preparation.py container-identity
      - name: Retain original proposal and explicit completeness
        if: always()
        run: python3 game/scripts/numeric/golden-preparation.py collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backport-shared-golden-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
