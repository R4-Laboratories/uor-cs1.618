name: Compiler source diagnostics
on:
  push:
    branches: [numeric-kernels]
    paths:
      - '.github/workflows/compiler-source-diagnostics.yml'
      - 'scripts/numeric/compiler-candidate/**'
      - 'scripts/numeric/restore-compiler-candidate.py'
      - 'scripts/numeric/check-compiler-source-stage.sh'
      - 'scripts/numeric/prepare-compiler-test-tools.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: game
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: afflom/lean4-prod
          ref: 991956fe427bb646498fd0912c89b71be71e7beb
          path: compiler
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the explicit diagnostic source snapshot
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 game/scripts/numeric/restore-compiler-candidate.py \
            game/scripts/numeric/compiler-candidate compiler > evidence/candidate.json
          printf '%s\n' "$GITHUB_SHA" > evidence/game-commit.txt
          df -h > evidence/disk-before.txt
          docker info --format '{{.Driver}}' > evidence/docker-storage-driver.txt
          printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" > evidence/runner-image.txt
      - name: Pull the unchanged pinned SDK
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 ghcr.io/uor-foundation/prismpm-sdk@sha256:d6c263a733a6bc36e0458c3f5b9a1f5ea9c14dfbe8c257d3f650a960b5fe633c
      - name: Run source gates and retain actual failures
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --user 0:0 \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE/compiler:/source" \
            -v "$GITHUB_WORKSPACE/game:/game:ro" \
            -v "$GITHUB_WORKSPACE/evidence:/evidence" \
            -w /source \
            ghcr.io/uor-foundation/prismpm-sdk@sha256:d6c263a733a6bc36e0458c3f5b9a1f5ea9c14dfbe8c257d3f650a960b5fe633c \
            /game/scripts/numeric/check-compiler-source-stage.sh 2>&1 | tee evidence/run.log
      - name: Capture generated changes for review
        if: always()
        run: |
          mkdir -p evidence
          if test -d compiler/.git; then
            git -C compiler diff --binary > evidence/generated-changes.patch
          fi
          df -h > evidence/disk-after.txt
      - name: Retain diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiler-source-${{ github.run_id }}
          path: evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
