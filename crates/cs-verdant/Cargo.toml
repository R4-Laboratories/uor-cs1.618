[package]
name = "cs-verdant"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Verdant Engine spatial kernel for cs1.618 client prediction and server authority"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
verdant-core = { git = "https://github.com/afflom/verdant-engine", rev = "9d22f5ac364db8352d12434e1c9c3dbed65ac6c9", default-features = false, features = ["uorc-wasm-decode"] }
serde_json = "1.0.140"
vram_representation = { path = "../../vendor/vRAM/vram_representation" }
vtensor_layout = { path = "../../vendor/vTensor/vtensor_layout" }
